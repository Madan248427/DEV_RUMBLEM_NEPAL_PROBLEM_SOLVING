version: "3.1"

intents:
  - greet
  - goodbye
  - search_book
  - check_availability
  - issue_book
  - return_book
  - reserve_book
  - view_history
  - check_due_date
  - cancel_reservation
  - book_info
  - library_hours
  - fine_status
  - renew_book
  - report_issue
  - help
  - affirm
  - deny
  - faq_app_name
  - faq_app_purpose
  - faq_membership_cost
  - faq_password_reset
  - small_talk
  - thank_you
  - complain
  - ask_contact
  - book_recommendation
  - how_to_signup

entities:
  - book_title
  - author_name
  - category
  - member_id
  - book_id

slots:
  book_title:
    type: text
    mappings:
      - type: from_entity
        entity: book_title
      - type: from_text

  author_name:
    type: text
    mappings:
      - type: from_entity
        entity: author_name
      - type: from_text

  category:
    type: text
    mappings:
      - type: from_entity
        entity: category
      - type: from_text

  member_id:
    type: text
    mappings:
      - type: from_entity
        entity: member_id
      - type: from_text

  book_id:
    type: text
    mappings:
      - type: from_entity
        entity: book_id
      - type: from_text

  search_results:
    type: text
    mappings:
      - type: custom

  jwt_token:
    type: text
    mappings:
      - type: custom
forms:
  search_book_form:
    required_slots:
      - book_title
      - author_name
      - category

  return_book_form:
    required_slots:
      - book_title
      - book_id

  reserve_book_form:
    required_slots:
      - book_title
      - book_id

  check_due_date_form:
    required_slots:
      - book_title
      - book_id

  renew_book_form:
    required_slots:
      - book_title
      - book_id

  cancel_reservation_form:
    required_slots:
      - book_title
      - book_id

  report_issue_form:
    required_slots:
      - book_title
      - book_id

responses:
  utter_how_to_signup:
    - text: "To sign up, click on the **Signup** button.
        Enter your email address and create a password.
        Then choose a subscription plan:
        • Rs 1500 per month
        • Rs 16000 per year
        Complete the payment through eSewa.
        After successful payment, your account will be activated."
    - text: "
        Registration is simple!
        First, click on Signup.
        Provide your email and set a password.
        Select either the 1500/month plan or the 16000/year plan.
        Pay using eSewa.
        Once payment is confirmed, your account becomes active. "
    - text: "
        Follow these steps to register:
        1. Click Signup.
        2. Enter your email and create a password.
        3. Choose a subscription plan (1500/month or 16000/year).
        4. Make payment via eSewa.
        After payment verification, your account will be activated. "
    - text: "
        To create an account, press the Signup button.
        Fill in your email and password.
        Select your subscription:
        - Rs 1500 monthly
        - Rs 16000 yearly
        Complete payment using eSewa.
        Once payment is successful, your account will be ready to use."

  utter_greet:
    - text: "Hello! Welcome to the Marvel Nexus: Library Management System. How can I help you today?"
    - text: "Hi there! 👋 I'm here to help with your library needs. What can I do for you?"
    - text: "Hi! I’m your Library Assistant Bot 📚✨"
    - text: "Welcome to the Marvel Nexus:online management system "
    - text: "Welcome back, reader! What would you like to do today?"
  utter_goodbye:
    - text: "Goodbye! Thanks for using the library system. Have a great day!"
    - text: "Thank you for using the Library Management System. Have a great day!"
    - text: "Goodbye! Feel free to visit the library anytime"
    - text: "Bye! 📖 See you soon for your next book!"
    - text: "See you later, reader! Happy learning!"

  utter_help:
    - text: |
        I can help you with:
        • Searching for books
        • Checking book availability
        • Issuing and returning books
        • Making reservations
        • Viewing your transaction history
        • Checking due dates
        • Renewing books
        • Checking your fine status

  utter_search_book_prompt:
    - text: "I'd be happy to help you search for a book. What's the book title or author name?"

  utter_check_availability_prompt:
    - text: "Which book would you like to check the availability for?"

  # utter_issue_book_prompt:
  #   - text: "Please provide the book title or ID you want to issue."

  utter_return_book_prompt:
    - text: "Which book would you like to return?"

  utter_reserve_book_prompt:
    - text: "Please provide the book title or ID you want to reserve."

  utter_history_prompt:
    - text: "Let me fetch your transaction history. Please provide your member ID."

  # utter_ask_member_id:
  #   - text: "May I have your member ID, please?"

  # utter_affirm:
  #   - text: "Great! Proceeding with your request."

  utter_deny:
    - text: "No problem! Is there anything else I can help you with?"

  utter_library_hours:
    - text: "Our library is open from 9 AM to 6 PM on weekdays and 10 AM to 4 PM on weekends."

  utter_default:
    - text: "I didn't quite understand that. Could you please rephrase?"
    - text: "Sorry, I'm not sure what you mean. Can you ask me something about books or library services?"

  utter_faq_app_name:
    - text: "This is the Library Management System - your complete digital library solution for browsing, borrowing, and managing books."

  utter_faq_app_purpose:
    - text: "Our app helps you search for books, check availability, borrow books, make reservations, track your borrowing history, and manage your membership - all in one place!"
    - text: "Looking for a book? Want to check availability or reserve one? You can do it all here! Browse books, borrow, reserve, view your history, and manage your membership anytime."
    - text: "Our app makes everything easy for you! You can search for books, see if they’re available, borrow or reserve them, track what you’ve read, and manage your membership — all in one simple place."
    - text: "Think of this app as your personal library assistant! Find books, check if they’re in stock, borrow or reserve them, see your past reads, and handle your membership — all in just a few clicks."

  utter_faq_membership_cost:
    - text: "The membership costs 1500 per month or 16000/year. This gives you unlimited access to our entire book collection and all library services."
    - text: "Our membership plan costs 1500 monthly or 16000/yearand includes full library privileges."
    - text: "For just Rs 1500  per month or 16000/year, you can enjoy unrestricted access to our entire catalog and facilities."

  utter_faq_password_reset:
    - text: "To reset your password: Click 'Forgot Password which is in the rignt buttom of login and ', enter your email, OTP is sent and enter that OTP and reset password."
    - text: "No worries! Just click on 'Forgot Password' at the bottom right of the login page. Enter your email address, check for the OTP we send you, and then use it to create a new password."
    - text: "To reset your password, click on 'Forgot Password' at the bottom right of the login page. Enter your registered email address, and we’ll send you an OTP. Enter the OTP and set your new password."

  utter_small_talk:
    - text: "That's great! Is there anything I can help you with regarding the library?"

  utter_thank_you:
    - text: "You're welcome! Happy to help. Is there anything else?"
    - text: "Glad I could help. Would you like assistance with anything else?"
    - text: "You're welcome. Feel free to ask if you need further help."

  utter_complain:
    - text: "I'm sorry to hear that. Please let me know what the issue is so I can help you resolve it."

  utter_ask_contact:
    - text: "You can contact our support team at MarvelNexus@libraryapp.com or call us at 9780000000."

